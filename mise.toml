[tasks.test]
run = "cargo test -- --nocapture"

[tasks.cap]
run = "cargo test"

[tasks.trace]
env.RUST_BACKTRACE = 1
run = "cargo test"

[tasks.build]
raw_args = true
run = "cargo build"

[tasks.crun]
raw_args = true
alias = "r"
run = "cargo run"

[tasks.adoc]
run = "cargo run -- compile --output-dir=./records/html --output-type=adoc"

[tasks.digraph]
run = "cargo run -- digraph --output-dir=./records/html --output-type=adoc"

[tasks.clean]
run = "cargo clean"

[tasks.clear]
run = "rm -rf ./records/*"

[tasks.cuc]
usage = '''
flag "-d --dry-run" {
    help "Enable dry-running"
}
'''
run = '''
{% if usage.dry_run %}
    cargo update-check
{% else %}
    cargo update-check -u
{% endif %}
'''

[tasks.clippy]
run = "bacon clippy"

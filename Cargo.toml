[package]
name = "record-tools-rs"
version = "0.1.0"
authors = [
    "Christoph Kappel <christoph@unexist.dev>"
]
license-file = "LICENSE"
homepage = "https://unexist.dev"
repository = "https://hg.unexist.dev/record-tools-rs"
edition = "2024"
exclude = ["/mise.toml", "/templates"]

[dependencies]
env_logger = "0.11.11"
log = "0.4.35"
clap = { version = "4.6.9", features = ["derive"] }
clap-config-file = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
config = "0.15.27"
anyhow = "1.0.104"
time = { version = "0.3.55", features = ["formatting", "macros"] }
slugify = "0.1.0"
stdext = "0.3.3"
regex = "1.13.2"
aho-corasick = "1.1.5"
prettytable = "0.10.0"
chrono = "0.4.45"
tap = "1.0.1"

# Optional
asciidocr = { version = "0.1.14", optional = true }
reqwest = { version = "0.13.5", features = ["blocking"], optional = true }
markdown = { version = "1.0.0", optional = true }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[features]
default = ["asciidoc", "markdown"]
asciidoc = ["asciidocr", "reqwest"]
markdown = ["dep:markdown"]

[[bin]]
name = "rtrs"
path = "src/main.rs"
